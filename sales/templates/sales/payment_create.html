{% extends 'base.html' %}

{% block title %}Ku Dar Lacag Bixin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 fs-5"><i class="bi bi-credit-card me-2"></i>Ku Dar Lacag Bixin Cusub</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'payment_list' %}" class="btn btn-outline-secondary">Kanoon (Cancel)</a>
                        <button type="submit" class="btn btn-success px-4">Kaydi (Save)</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
