<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <title>Diwaan-gelin (Register)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h4>Akaoun Cusub Abuur</h4>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-success w-100">Diwaan-geli</button>
                        </form>
                        <hr>
                        <p class="text-center">Akaoun ma leedahay? <a href="{% url 'login' %}">Log in halkan</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
