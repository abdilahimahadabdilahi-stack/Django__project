{% extends 'base.html' %}

{% block title %}Samayso Akownt Cusub{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Akowt Cusub Abuur</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label fw-bold">
                                    {{ field.label }}
                                </label>
                                <input type="{{ field.field.widget.input_type|default:'text' }}" 
                                       name="{{ field.name }}" 
                                       id="{{ field.id_for_label }}" 
                                       class="form-control {% if field.errors %}is-invalid{% endif %}"
                                       value="{{ field.value|default:'' }}">
                                {% for error in field.errors %}
                                    <div class="invalid-feedback d-block">{{ error }}</div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">Diwaan Geli</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <small>Sidaan hore uga tirsanayd? <a href="{% url 'login' %}">Log-in sameey</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
