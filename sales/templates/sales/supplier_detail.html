{% extends 'sales/base.html' %}

{% block content %}
<div class="container mt-4">

    <div class="row d-flex justify-content-center">
        <div class="col-8">

            <div class="card p-4">
                <h4>Supplier Detail</h4>
                <hr>

                <p><strong>Sales Person:</strong> {{ supplier.sales_person }}</p>
                <p><strong>Address:</strong> {{ supplier.address }}</p>
                <p><strong>Phone:</strong> {{ supplier.phone }}</p>
                <p><strong>Product:</strong> {{ supplier.product }}</p>

                <div class="mt-3">
                    <a href="{% url 'supplier_update' supplier.id %}" class="btn btn-warning">
                        Update
                    </a>

                    <a href="{% url 'supplier_delete' supplier.id %}" class="btn btn-danger">
                        Delete
                    </a>

                    <a href="{% url 'supplier_list' %}" class="btn btn-secondary">
                        Back
                    </a>
                </div>

            </div>

        </div>
    </div>

</div>
{% endblock %}
