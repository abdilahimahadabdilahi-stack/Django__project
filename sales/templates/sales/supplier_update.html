{% extends 'sales/base.html' %}

{% block content %}
<div class="container mt-4">

    <div class="row d-flex justify-content-center">
        <div class="col-8">

            <div class="card p-4">
                <h4 class="mb-3">Update Supplier</h4>

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group mb-2">
                        <label class="form-label">Sales Person</label>
                        <input type="text" name="sales_person" value="{{ supplier.sales_person }}" class="form-control">
                    </div>

                    <div class="form-group mb-2">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" value="{{ supplier.address }}" class="form-control">
                    </div>

                    <div class="form-group mb-2">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" value="{{ supplier.phone }}" class="form-control">
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Product</label>
                        <input type="text" name="product" value="{{ supplier.product }}" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-success">Update</button>
                    <a href="{% url 'supplier_list' %}" class="btn btn-secondary">Cancel</a>
                </form>

            </div>

        </div>
    </div>

</div>
{% endblock %}
