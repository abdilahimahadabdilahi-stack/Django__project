{% extends 'base.html' %}

{% block title %}Ku Dar Warbixin Cusub (Report){% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0 fs-5"><i class="bi bi-file-earmark-text me-2"></i>Ku Dar Warbixin Cusub</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'report_list' %}" class="btn btn-outline-secondary">Kansal (Cancel)</a>
                        <button type="submit" class="btn btn-primary px-4">Kaydi Warbixinta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
